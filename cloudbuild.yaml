steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yebomart-api:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yebomart-api:$COMMIT_SHA']

  # Deploy container image to Cloud Run.
  # Service name is parameterised so the same cloudbuild.yaml powers
  # both the prod trigger (substitutes _SERVICE=yebomart-api-prod) and
  # the dev trigger (_SERVICE=yebomart-api-dev). Without this, the deploy
  # was creating a third zombie service called bare "yebomart-api" under
  # the default compute SA — that's how a "successful" Cloud Build was
  # producing a totally orphaned revision.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yebomart-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account=yebomart-runtime@hiyebo.iam.gserviceaccount.com'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'NODE_ENV=production,R2_ACCOUNT_ID=9f15f12d867a59b212ed2ae3cf4615ca,R2_BUCKET_NAME=yebomart-images,R2_PUBLIC_URL=https://pub-9f15f12d867a59b212ed2ae3cf4615ca.r2.dev,YEBOPAY_BASE_URL=${_YEBOPAY_BASE_URL}'
      # YEBOPAY_API_KEY binds the merchant key provisioned in Phase 1.5.
      # YEBOLINK_API_KEY binds the comms key (customer statements / reminders +
      # daily WhatsApp reports / low-stock alerts).
      # INTERNAL_NOTIFICATIONS_SECRET gates POST /api/internal/notifications/run
      # (called by Cloud Scheduler). Dev trigger overrides the *_SECRET subs
      # (→ _DEV variants) and _YEBOPAY_BASE_URL (→ dev yebopay service).
      # Comma-separated so all bind in one additive --update-secrets.
      # JWT_SECRET / JWT_REFRESH_SECRET sign the yebomart-internal staff and
      # admin tokens. They live in Secret Manager with SEPARATE dev and prod
      # values (the dev trigger overrides the subs to the _DEV variants): when
      # both environments shared one secret, a staff token minted on dev
      # authenticated against prod. utils/jwt.ts throws at boot if either is
      # missing, so a dropped binding fails the deploy instead of silently
      # falling back to a default.
      - '--update-secrets'
      - 'YEBOPAY_API_KEY=${_YEBOPAY_API_KEY_SECRET}:latest,YEBOLINK_API_KEY=${_YEBOLINK_API_KEY_SECRET}:latest,INTERNAL_NOTIFICATIONS_SECRET=${_INTERNAL_NOTIFICATIONS_SECRET}:latest,YEBOPAY_WEBHOOK_SECRET=${_YEBOPAY_WEBHOOK_SECRET}:latest,JWT_SECRET=${_JWT_SECRET}:latest,JWT_REFRESH_SECRET=${_JWT_REFRESH_SECRET}:latest'

substitutions:
  _SERVICE: yebomart-api-prod
  _YEBOPAY_API_KEY_SECRET: YEBOMART__YEBOPAY_API_KEY
  _YEBOLINK_API_KEY_SECRET: YEBOMART__YEBOLINK_API_KEY
  _INTERNAL_NOTIFICATIONS_SECRET: YEBOMART__INTERNAL_NOTIFICATIONS_SECRET
  # Verifies YeboPay's HMAC on inbound webhooks (invoice.paid activates a plan).
  _YEBOPAY_WEBHOOK_SECRET: YEBOMART__YEBOPAY_WEBHOOK_SECRET
  # The gateway's own domain, never the raw *.run.app hostname behind it — that
  # changes silently on any rename/re-region of the service. The dev trigger
  # overrides this to https://dev-api.yebopay.app.
  _YEBOPAY_BASE_URL: https://api.yebopay.app
  # Signing keys for yebomart-internal staff/admin JWTs. Dev trigger overrides
  # both to the _DEV variants so a dev-issued token can never pass on prod.
  _JWT_SECRET: YEBOMART__JWT_SECRET
  _JWT_REFRESH_SECRET: YEBOMART__JWT_REFRESH_SECRET

images:
  - 'gcr.io/$PROJECT_ID/yebomart-api:$COMMIT_SHA'

# Required because the trigger runs under a custom service account
# (yebomart-runtime@hiyebo). Without this, Cloud Build refuses to start
# with "if 'build.service_account' is specified, the build must either
# specify 'build.logs_bucket' or use CLOUD_LOGGING_ONLY logging".
options:
  logging: CLOUD_LOGGING_ONLY
